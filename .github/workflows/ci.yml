name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR ref: a new push supersedes the in-flight run. Never on master, so every
# commit on the release branch keeps its own result instead of being cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-and-test:
    name: go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the `go` directive of the committed go.mod; the upper bound is the
        # toolchain the proto compiler image generates with.
        go-version: ['1.25', '1.27']
    steps:
      # `submodules:` is deliberately NOT enabled: the generated api/ directory is committed to
      # this repository, so the module compiles from the checkout alone, and both submodules are
      # codegen inputs only. Regenerating the stubs needs Docker and is a separate concern - this
      # workflow builds and tests what is committed, which is what consumers of the module get.
      - uses: actions/checkout@v5

      # @v6 rather than @v5: v5 still targets Node.js 20, which the runners deprecated and now
      # force onto Node.js 24 with a warning annotation on every run.
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      # Nothing below this line is allowed to pass by finding no work to do. This is the guard
      # that makes that true: it fails when api/ is absent or holds no stubs, so the whole job
      # cannot go green on an empty checkout the way it did before the stubs were committed.
      - name: Assert the generated stubs are committed
        run: make check_stubs

      # From major version 2 on, a go module path has to end in /vN, and NOTHING at build time
      # notices when it stops agreeing with the released version: the module compiles, the suite is
      # green, and `go get` simply cannot resolve the tag once it is pushed. This is the gate that
      # keeps that mismatch from ever reaching a tag again.
      - name: Assert the module path matches the version
        run: make check_go_module_path

      # A module whose manifest does not resolve is not installable, no matter what compiles
      # locally - so verify the committed go.mod/go.sum against the module proxy first.
      - name: Verify the module manifest
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: make fmt_check

      - name: go vet
        run: make vet

      - name: go build
        run: make go_build

      # Runs the suite under the race detector and fails when coverage of the hand-written
      # packages drops below the threshold in the Makefile (currently 100%). The generated stubs
      # are kept out of that number - they are machine output - but the same run exercises them
      # for real: messages round-trip on the wire and every generated unary stub is called.
      - name: go test with the coverage gate
        run: make test_coverage

      # Reported, never gated: how much of the generated code the suite touches. A drop here is
      # worth a look, but pinning it would be pinning the size of protoc's output.
      - name: Report coverage of the generated stubs
        run: make test_coverage_generated

      # Publishing is what this repository exists for, and a go module is published by TAGGING it:
      # proxy.golang.org clones the tag and serves a zip of exactly what git has under it, with no
      # upload and no credential in between. So the packaging path is rehearsed here on every push,
      # in full - `make publish_dry_run` packs `git archive HEAD` into that very zip, serves it
      # through a throwaway file:// module proxy and resolves it from a consumer module outside this
      # tree, under the real release version.
      #
      # It replaces the older `replace`-based smoke test, which pointed at the WORKING TREE and so
      # could not see the most expensive mistake this repository can make: generated code that never
      # reached the tag (a stray .gitignore entry) publishes a module that compiles here and is
      # empty for every consumer. A published version is immutable, so it has to fail before the tag.
      - name: Rehearse the module publication
        run: make publish_dry_run
